<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        #map {
            width: 100%;
            height: 400px;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Dashboard</h1>

<button id="showMapBtn">Pokaż mapkę</button>
<button id="logoutBtn">Wyloguj</button>

<div id="map"></div>
<p id="msg"></p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFp4tfV1bvfafRzu9OX9SJzst3EWsR3YE",
        authDomain: "kol-trans-car-manager-login.firebaseapp.com",
        projectId: "kol-trans-car-manager-login",
        storageBucket: "kol-trans-car-manager-login.firebasestorage.app",
        messagingSenderId: "278853848291",
        appId: "1:278853848291:web:6ca943722debac13b4c9d6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 🔐 Ochrona strony
    onAuthStateChanged(auth, user => {
        if (!user) {
            window.location.href = "index.html";
        }
    });

    // 🚪 Wylogowanie
    document.getElementById("logoutBtn").onclick = () => {
        signOut(auth).then(() => {
            window.location.href = "index.html";
        });
    };

    // 🗺️ Pokaż mapkę dopiero po sprawdzeniu tokena
    document.getElementById("showMapBtn").onclick = async () => {
        const user = auth.currentUser;

        if (!user) {
            document.getElementById("msg").innerText = "Brak autoryzacji";
            return;
        }

        // 🔑 sprawdzenie tokena (ważne)
        const token = await user.getIdToken();
        if (!token) {
            document.getElementById("msg").innerText = "Nieprawidłowy token";
            return;
        }

        loadMap();
    };

    // 🗺️ Ładowanie Google Maps
    function loadMap() {
        if (window.mapLoaded) return;
        window.mapLoaded = true;

        const script = document.createElement("script");
        script.src =
            "https://maps.googleapis.com/maps/api/js?key=AIzaSyCDwQLig57_MHm7OrUpsqZxRYco9bI12gI";
        script.async = true;
        script.onload = initMap;
        document.head.appendChild(script);
    }

    function initMap() {
        document.getElementById("map").style.display = "block";

        new google.maps.Map(document.getElementById("map"), {
            center: { lat: 52.2297, lng: 21.0122 }, // Warszawa
            zoom: 10
        });
    }
</script>

</body>
</html>
