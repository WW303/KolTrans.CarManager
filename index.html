<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOL-TRANS | Logowanie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617; /* Slate 950 */
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.8); /* bg-slate-900 z przezroczystością */
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    input::placeholder {
      color: #475569; /* slate-500 */
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="glass-card w-full max-w-md p-10 rounded-[2rem] shadow-2xl animate-fade-in">
  <div class="text-center mb-10">
    <h1 class="text-3xl font-bold text-indigo-400 tracking-tighter uppercase">Kol-Trans</h1>
    <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1 font-bold">Car Manager System</p>
  </div>

  <div class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-slate-400 mb-2 ml-1">Adres Email</label>
      <input type="email" id="email"
             class="w-full px-5 py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all"
             placeholder="nazwa@firma.pl">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-400 mb-2 ml-1">Hasło</label>
      <input type="password" id="password"
             class="w-full px-5 py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all"
             placeholder="••••••••">
    </div>

    <button onclick="login()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-900/20 transition-all active:scale-[0.97] mt-4 uppercase tracking-wide text-sm">
      Zaloguj się do systemu
    </button>

    <p id="msg" class="text-center text-red-400 text-sm font-medium min-h-[20px] mt-4"></p>
  </div>

  <div class="mt-10 text-center border-t border-slate-800 pt-6">
    <p class="text-[10px] text-slate-600 uppercase tracking-[0.2em] font-semibold">&copy; 2026 KOL-TRANS Systems</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFp4tfV1bvfafRzu9OX9SJzst3EWsR3YE",
    authDomain: "kol-trans-car-manager-login.firebaseapp.com",
    projectId: "kol-trans-car-manager-login",
    storageBucket: "kol-trans-car-manager-login.firebasestorage.app",
    messagingSenderId: "278853848291",
    appId: "1:278853848291:web:6ca943722debac13b4c9d6",
    measurementId: "G-S7RYS41TRC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    if (!email || !password) {
      msg.innerText = "Wypełnij wszystkie pola.";
      return;
    }

    msg.innerText = "Autoryzacja...";
    msg.classList.replace("text-red-400", "text-indigo-400");

    signInWithEmailAndPassword(auth, email, password)
            .then(() => {
              window.location.href = "dashboard.html";
            })
            .catch(err => {
              msg.classList.replace("text-indigo-400", "text-red-400");
              msg.innerText = "Błąd: Dane logowania są nieprawidłowe.";
              console.error(err.message);
            });
  }
</script>

</body>
</html>
