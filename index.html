<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KOL-TRANS | Logowanie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* --- TWOJE CENTRUM DOWODZENIA KOLORAMI --- */
    :root {
      --kolor-glowny: #283eff;       /* Kolor napisu Kol-Trans (indigo-400) */
      --kolor-przycisku: #283eff;    /* Kolor tła przycisku (indigo-600) */
      --kolor-przycisku-hover: rgba(40, 62, 255, 0.5); /* Kolor przycisku po najechaniu */
      --kolor-poswiaty: rgba(79, 70, 229, 0.3); /* Cień pod przyciskiem */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      overflow-x: hidden;
    }

    /* Zastosowanie zmiennych w klasach */
    .brand-text { color: var(--kolor-glowny) !important; }

    .custom-button {
      background-color: var(--kolor-przycisku) !important;
      box-shadow: 0 4px 15px var(--kolor-poswiaty) !important;
      transition: all 0.2s ease;
    }
    .custom-button:hover {
      background-color: var(--kolor-przycisku-hover) !important;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    input, button { font-size: 16px !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

<div class="glass-card w-full max-w-md p-6 sm:p-10 rounded-[1.5rem] sm:rounded-[2rem] shadow-2xl animate-fade-in">

  <div class="text-center mb-8 sm:mb-10">
    <h1 class="text-4xl sm:text-5xl font-bold tracking-tighter uppercase brand-text">Kol-Trans</h1>
    <p class="text-[14px] sm:text-[15px] text-slate-500 uppercase tracking-widest mt-1 font-bold">Car manager</p>
  </div>

  <div class="space-y-4 sm:space-y-5">
    <div>
      <label class="block text-xs sm:text-sm font-medium text-slate-400 mb-1.5 ml-1">Adres Email</label>
      <input type="email" id="email" autocomplete="email"
             class="w-full px-4 py-3 sm:px-5 sm:py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all"
             placeholder="nazwa@firma.pl">
    </div>

    <div>
      <label class="block text-xs sm:text-sm font-medium text-slate-400 mb-1.5 ml-1">Hasło</label>
      <input type="password" id="password" autocomplete="current-password"
             class="w-full px-4 py-3 sm:px-5 sm:py-3.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all"
             placeholder="••••••••">
    </div>

    <button id="loginBtn" onclick="login()"
            class="w-full text-white font-bold py-3.5 sm:py-4 rounded-xl custom-button transition-all active:scale-[0.96] mt-2 sm:mt-4 uppercase tracking-wide text-xs sm:text-sm">
      Zaloguj się do systemu
    </button>

    <p id="msg" class="text-center text-red-400 text-xs sm:text-sm font-medium min-h-[20px] mt-4"></p>
  </div>

  <div class="mt-8 sm:mt-10 text-center border-t border-slate-800 pt-6">
    <p class="text-[9px] sm:text-[10px] text-slate-600 uppercase tracking-[0.2em] font-semibold">&copy; 2026 KOL-TRANS Systems</p>
  </div>
</div>

<script type="module">
  // ... (Logika Firebase pozostaje bez zmian) ...
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAFp4tfV1bvfafRzu9OX9SJzst3EWsR3YE",
    authDomain: "kol-trans-car-manager-login.firebaseapp.com",
    projectId: "kol-trans-car-manager-login",
    storageBucket: "kol-trans-car-manager-login.firebasestorage.app",
    messagingSenderId: "278853848291",
    appId: "1:278853848291:web:6ca943722debac13b4c9d6",
    measurementId: "G-S7RYS41TRC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    if (!email || !password) {
      msg.innerText = "Wypełnij wszystkie pola.";
      return;
    }

    msg.innerText = "Autoryzacja...";
    msg.style.color = "var(--kolor-glowny)";

    signInWithEmailAndPassword(auth, email, password)
            .then(() => {
              window.location.href = "dashboard.html";
            })
            .catch(err => {
              msg.style.color = "#f87171";
              msg.innerText = "Błąd: Dane logowania są nieprawidłowe.";
              console.error(err.message);
            });
  };

  document.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') window.login();
  });
</script>

</body>
</html>
